name: Aplicar correção INSPIRA Presente 03

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  aplicar:
    if: github.event.pull_request.head.ref == 'fix-inspira-presente03-20260907'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-inspira-presente03-20260907
          fetch-depth: 0
      - name: Instalar bibliotecas
        run: python -m pip install --quiet pillow opencv-python-headless
      - name: Corrigir a arte
        run: |
          if [ -f scripts/fix_inspira_presente03.py ]; then
            python scripts/fix_inspira_presente03.py
          else
            echo "Correção já aplicada; utilitário temporário não existe mais."
          fi
      - name: Salvar na branch
        run: |
          if git diff --quiet; then
            echo "Sem alterações pendentes."
            exit 0
          fi
          rm -f scripts/fix_inspira_presente03.py .github/workflows/fix-inspira-presente03.yml
          git config user.name "ChatGPT Site Update"
          git config user.email "andreschuindt@gmail.com"
          git add -A
          git commit -m "Corrige Alma Cuidada para INSPIRA na arte Presente 03"
          git push origin HEAD:fix-inspira-presente03-20260907
